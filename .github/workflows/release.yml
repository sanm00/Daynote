name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-universal
            runner: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-x86_64
            runner: ubuntu-22.04
            args: ""
          - platform: windows-x86_64
            runner: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            librsvg2-dev libxdo-build patchelf

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Daynote ${{ github.ref_name }}"
          args: ${{ matrix.args }}
          releaseBody: |
            见下方产物：macOS（universal）、Linux（.deb / .AppImage）、Windows（.msi / setup.exe）。
            首次运行 macOS 包可能需要手动允许（未签名 / 未公证）。

            See the assets below for macOS (universal), Linux (.deb / .AppImage) and Windows (.msi / setup.exe).
            The unsigned macOS build may need to be allowed manually on first launch.
          releaseDraft: true
          prerelease: false
