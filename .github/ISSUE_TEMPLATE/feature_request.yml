name: 功能建议 / Feature request
description: 提出一个新想法 / Suggest an idea
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issues，确认不是重复建议。Please search existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / Problem statement
      placeholder: 清晰描述你的痛点或场景。Describe your pain point or scenario clearly.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      placeholder: 你希望它如何工作？How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 截图、草图、其他项目的参考等。Screenshots, sketches, references.
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已搜索过已有 Issues，没有重复 / I have searched existing issues
          required: true
