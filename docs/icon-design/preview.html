<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daynote · 留白的 D</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:48px;background:#ede7da;color:#302f2a;font-family:system-ui,sans-serif}main{max-width:880px;margin:auto}h1{font-size:28px;font-weight:550}p{color:#625e55;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.panel{padding:32px;border-radius:20px;background:#fbf8f1}.dark{background:#24231f;color:#fffdf8}.hero{display:block;width:200px;height:200px;margin:24px auto 40px}.sizes{display:flex;gap:24px;align-items:center;min-height:72px}.sample{display:grid;justify-items:center;gap:12px}small{font-size:11px;opacity:.65}.brand{display:flex;align-items:center;gap:6px;margin-top:32px}.brand img{width:26px;height:26px}.name{font-family:Georgia,serif;font-size:13px}.sub{font:10px system-ui;letter-spacing:.14em;opacity:.65;margin-top:2px}
</style>
<main>
  <h1>留白的 D</h1>
  <p>单一轮廓、右上开口。陶土色沿用界面主色，米白色用于桌面符号。</p>
  <div class="grid">
    <section class="panel">
      <img class="hero" src="../../src/assets/daynote-icon.svg" alt="留白的 D 桌面图标">
      <div class="sizes">
        <div class="sample"><img src="../../src/assets/daynote-icon.svg" width="64" height="64" alt="64 像素图标"><small>64 px</small></div>
        <div class="sample"><img src="../../src/assets/daynote-icon.svg" width="32" height="32" alt="32 像素图标"><small>32 px</small></div>
        <div class="sample"><img src="../../src/assets/daynote-icon.svg" width="24" height="24" alt="24 像素图标"><small>24 px</small></div>
      </div>
      <div class="brand"><img src="../../src/assets/daynote-mark.svg" alt="随记标识"><div class="name">随记<div class="sub">Daynote</div></div></div>
    </section>
    <section class="panel dark">
      <img class="hero" src="../../src/assets/daynote-mark.svg" alt="独立 D 符号">
      <div class="sizes">
        <div class="sample"><img src="../../src/assets/daynote-mark.svg" width="48" height="48" alt="48 像素标识"><small>48 px</small></div>
        <div class="sample"><img src="../../src/assets/daynote-mark.svg" width="26" height="26" alt="26 像素标识"><small>26 px</small></div>
        <div class="sample"><img src="../../src/assets/daynote-mark.svg" width="24" height="24" alt="24 像素标识"><small>24 px</small></div>
      </div>
      <div class="brand"><img src="../../src/assets/daynote-mark.svg" alt="随记标识"><div class="name">随记<div class="sub">Daynote</div></div></div>
    </section>
  </div>
</main>
</html>
